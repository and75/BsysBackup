name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # I test usano solo il motore: il binario di Electron non serve
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Costo dell'elenco per file di Robocopy
        if: runner.os == 'Windows'
        run: node scripts/bench-robocopy.js

  installer:
    needs: test
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Installer non firmato: nessun certificato da cercare
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Installa in modalità silenziosa e prova l'app installata
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter "BsysBackup-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer non trovato in release/" }
          Write-Host "Installer: $($setup.Name), $([math]::Round($setup.Length / 1MB, 1)) MB"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter "BsysBackup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "BsysBackup.exe non trovato dopo l'installazione" }
          Write-Host "Installato in: $($exe.FullName)"
          node scripts/smoke-packaged.js $exe.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: BsysBackup-Setup
          path: release/BsysBackup-Setup-*.exe
          if-no-files-found: error
