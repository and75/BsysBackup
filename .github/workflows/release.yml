name: Release

# Pubblica una GitHub Release con l'installer Windows. Due modi per avviarla:
# - a mano ("Run workflow" nella pagina Actions): rilascia la versione scritta in package.json e ne crea il tag;
# - creando un tag di versione (es. v0.2.0) che coincide con la versione di package.json.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Installer non firmato: nessun certificato da cercare
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Determina la versione da rilasciare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Il tag $env:GITHUB_REF_NAME non corrisponde alla versione $version di package.json"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "La release $tag esiste già: aumenta la versione in package.json prima di rilasciare"
          }
          # "release non trovata" è l'esito atteso: il suo codice di uscita non deve far fallire il passo
          $global:LASTEXITCODE = 0
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "Versione da rilasciare: $tag"
      - run: npm ci
      - run: npm run dist:win
      - name: Installa in modalità silenziosa e prova l'app installata
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter "BsysBackup-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer non trovato in release/" }
          Write-Host "Installer: $($setup.Name), $([math]::Round($setup.Length / 1MB, 1)) MB"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter "BsysBackup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "BsysBackup.exe non trovato dopo l'installazione" }
          Write-Host "Installato in: $($exe.FullName)"
          node scripts/smoke-packaged.js $exe.FullName
      - name: Pubblica la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem release -Filter "BsysBackup-Setup-*.exe" | Select-Object -First 1
          Set-Content -Path release-notes.md -Encoding utf8 -Value 'Installer per Windows a 64 bit. Non è firmato: all''avvio Windows SmartScreen mostra un avviso; si prosegue con **Ulteriori informazioni** e poi **Esegui comunque**.'
          # Se il tag non esiste ancora (avvio manuale) viene creato sul commit in corso
          gh release create $env:RELEASE_TAG $setup.FullName --target $env:GITHUB_SHA --title "BsysBackup $env:RELEASE_TAG" --notes-file release-notes.md --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Creazione della release non riuscita" }
